services:
  postiz:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: postiz
    restart: always

    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.postiz.rule=Host(`social.yatradigital.com`)'
      - 'traefik.http.routers.postiz.entrypoints=https'
      - 'traefik.http.routers.postiz.tls=true'
      - 'traefik.http.routers.postiz.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.postiz.service=postiz'
      - 'traefik.http.services.postiz.loadbalancer.server.port=5000'
      - 'traefik.docker.network=coolify'

    environment:
      MAIN_URL: 'https://social.yatradigital.com'
      FRONTEND_URL: 'https://social.yatradigital.com'

      NEXT_PUBLIC_BACKEND_URL: 'https://social.yatradigital.com/api'
      NEXT_PUBLIC_OVERRIDE_BACKEND_URL: 'https://social.yatradigital.com/api'

      # Secrets are set in Coolify -> Environment Variables, never committed here
      JWT_SECRET: '${JWT_SECRET}'

      DATABASE_URL: 'postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local'
      REDIS_URL: 'redis://postiz-redis:6379'

      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      TEMPORAL_ADDRESS: 'temporal:7233'

      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'

      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'

      # other settings...

      # === Social Media API Settings
      X_URL: '${X_URL}'
      X_API_KEY: '${X_API_KEY}'
      X_API_SECRET: '${X_API_SECRET}'

      LINKEDIN_CLIENT_ID: '${LINKEDIN_CLIENT_ID}'
      LINKEDIN_CLIENT_SECRET: '${LINKEDIN_CLIENT_SECRET}'

      FACEBOOK_APP_ID: '${FACEBOOK_APP_ID}'
      FACEBOOK_APP_SECRET: '${FACEBOOK_APP_SECRET}'

      # other settings...

    ports:
      - '4007:5000'

    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads

    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy

    networks:
      - postiz-network
      - postiz-temporal-network
      - coolify

  postiz-postgres:
    image: postgres:17-alpine
    restart: always

    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local

    volumes:
      - postgres-volume:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postiz-user -d postiz-db-local']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - postiz-network

  postiz-redis:
    image: redis:7.2
    restart: always

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - redis-data:/data

    networks:
      - postiz-network

  temporal-postgresql:
    image: postgres:16
    restart: always

    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal

    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

    networks:
      - postiz-temporal-network

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    restart: always

    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms256m -Xmx256m'

    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data

    networks:
      - postiz-temporal-network

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: always

    ports:
      - '7233:7233'

    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch

    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql

      ENABLE_ES: 'true'
      ES_SEEDS: temporal-elasticsearch
      ES_VERSION: v7

      TEMPORAL_NAMESPACE: default

      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml

    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

    networks:
      - postiz-temporal-network

  temporal-admin-tools:
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    restart: always

    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233

    depends_on:
      - temporal

    networks:
      - postiz-temporal-network

  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: always

    environment:
      TEMPORAL_ADDRESS: temporal:7233

    depends_on:
      - temporal

    networks:
      - postiz-temporal-network

networks:
  postiz-network:

  postiz-temporal-network:

  coolify:
    external: true

volumes:
  postgres-volume:

  redis-data:

  postiz-config:

  postiz-uploads:

  temporal-postgres-data:

  temporal-elasticsearch-data:
